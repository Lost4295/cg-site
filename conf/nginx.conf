# nginx sans root : pid et fichiers temporaires dans /tmp (emptyDir),
# écoute sur 8080. Le TLS est terminé en amont (Caddy), on ne voit que du HTTP.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    server {
        listen 8080;
        server_name _;

        root /var/www/html/public;
        index index.php;
        client_max_body_size 20M;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Sondes Kubernetes (ne passe pas par PHP)
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri /index.php$is_args$args;
        }

        location ~ ^/index\.php(/|$) {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT   $realpath_root;
            # Toutes les requêtes arrivent de Caddy en HTTPS : Symfony doit générer
            # des URL en https:// (redirections, callback OAuth Discord).
            fastcgi_param HTTPS on;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_read_timeout 60s;
            internal;
        }

        # Aucun autre script PHP n'est exécutable
        location ~ \.php$ {
            return 404;
        }

        location ~ /\. { deny all; }
        location ~* \.(?:ini|log|env|sql|bak|old)$ { deny all; }
    }
}
