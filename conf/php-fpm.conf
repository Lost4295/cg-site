; Chargé après www.conf et zz-docker.conf de l'image officielle (ordre alphabétique)
[global]
error_log = /proc/self/fd/2

[www]
; Seulement nginx, dans le même conteneur
listen = 127.0.0.1:9000
; Variables d'environnement du pod (Secret cg-site-env) visibles par Symfony
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
