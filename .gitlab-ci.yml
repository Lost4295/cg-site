# Déploiement sur le cluster Kubernetes du home-lab, via Argo CD.
#
#   gitleaks : recherche de secrets dans tout l'historique Git (toutes les branches)
#   build    : construit l'image et la pousse dans le registry GitLab
#              ($CI_REGISTRY_IMAGE:prod.<AAAAMMJJ>, date UTC du build)
#   deploy   : écrit le tag et le digest de l'image dans apps/cg-site/values.yaml
#              du repo k8s-platform ; Argo CD détecte le commit et déploie.
#              Le digest change à chaque build : deux builds le même jour (même
#              tag) sont donc bien déployés tous les deux.
#
#   Seule la branche master construit et déploie ; les autres branches ne passent
#   que gitleaks.
#
# Variable à définir dans GitLab > Settings > CI/CD > Variables (masked) :
#   K8S_PLATFORM_TOKEN : project access token du repo home-lab/k8s-platform,
#                        scope write_repository, rôle autorisé à pousser sur main

stages:
    - test
    - build
    - deploy

variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    K8S_PLATFORM_REPO: gitlab.bonnard.io/home-lab/k8s-platform.git
    VALUES_FILE: apps/cg-site/values.yaml

# Branches qui construisent et déploient, communes à build et deploy
.deploy-rules: &deploy-rules
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
          TAG_PREFIX: prod
          K8S_PLATFORM_BRANCH: main
.
gitleaks:
    stage: test
    tags:
        - runner-docker-2
    image:
        name: zricethezav/gitleaks:v8.30.1
        entrypoint: [""]
    variables:
        GIT_DEPTH: 0                 # tout l'historique, pas seulement les derniers commits
    script:
        - git config --global --add safe.directory "$CI_PROJECT_DIR"
        # --redact : les secrets trouvés sont masqués dans le log du job
        - gitleaks git --redact --verbose --no-banner .

build:
    stage: build
    tags:
        - runner-docker-2
    image: docker:24
    needs: [gitleaks]
    before_script:
        - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    script:
        - IMAGE_TAG="${TAG_PREFIX}.$(date -u +%Y%m%d)"
        - |
            docker build --pull \
              --label org.opencontainers.image.revision="$CI_COMMIT_SHA" \
              --label org.opencontainers.image.source="$CI_PROJECT_URL" \
              -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG" .
        - docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
        # Digest attribué par le registry au push
        - |
            IMAGE_DIGEST=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$CI_REGISTRY_IMAGE:$IMAGE_TAG" \
              | grep "^$CI_REGISTRY_IMAGE@" | head -1 | cut -d@ -f2)
        - test -n "$IMAGE_DIGEST"
        - 'echo "Image poussée -> $CI_REGISTRY_IMAGE:$IMAGE_TAG@$IMAGE_DIGEST"'
        # Transmis au job deploy
        - printf 'IMAGE_TAG=%s\nIMAGE_DIGEST=%s\n' "$IMAGE_TAG" "$IMAGE_DIGEST" > build.env
    artifacts:
        reports:
            dotenv: build.env
    rules: *deploy-rules

deploy:
    stage: deploy
    tags:
        - runner-docker-2
    image: alpine:3.20
    needs:
        - job: build
          artifacts: true            # récupère IMAGE_TAG et IMAGE_DIGEST
    resource_group: production       # un seul déploiement à la fois
    before_script:
        - apk add --no-cache git
        - test -n "$IMAGE_TAG" && test -n "$IMAGE_DIGEST"
        - test -n "$K8S_PLATFORM_TOKEN" || { echo "K8S_PLATFORM_TOKEN absente (variable protected sur une branche non protégée ?)"; exit 1; }
    script:
        - git clone --depth 1 --branch "$K8S_PLATFORM_BRANCH" "https://oauth2:${K8S_PLATFORM_TOKEN}@${K8S_PLATFORM_REPO}" k8s-platform
        - cd k8s-platform
        - 'sed -i -E -e "s|^(  tag: ).*$|\1\"${IMAGE_TAG}\"|" -e "s|^(  digest: ).*$|\1\"${IMAGE_DIGEST}\"|" "$VALUES_FILE"'
        - 'grep -q "^  tag: \"${IMAGE_TAG}\"$" "$VALUES_FILE"'
        - 'grep -q "^  digest: \"${IMAGE_DIGEST}\"$" "$VALUES_FILE"'
        - git config user.name "cg-site CI"
        - git config user.email "cg-site-ci@noreply.gitlab.bonnard.io"
        - git add "$VALUES_FILE"
        - |
            if git diff --cached --quiet; then
              echo "Image ${IMAGE_TAG}@${IMAGE_DIGEST} déjà déployée"
            else
              git commit -m "chore(cg-site): deploy ${IMAGE_TAG}" -m "${IMAGE_DIGEST}" -m "${CI_PROJECT_URL}/-/commit/${CI_COMMIT_SHA}"
              # la branche a pu avancer depuis le clone : on rebase et on réessaie
              for i in 1 2 3; do
                git push origin "$K8S_PLATFORM_BRANCH" && exit 0
                git pull --rebase origin "$K8S_PLATFORM_BRANCH"
              done
              exit 1
            fi
    rules: *deploy-rules
